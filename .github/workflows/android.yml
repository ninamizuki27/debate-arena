name: Build and publish Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (current tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Debate-Arena.apk
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: debate-arena-debug-apk
          path: Debate-Arena.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "Debate Arena - Latest APK" --notes "Development build; ChatGPT sign-in has not been verified on a physical device." --prerelease
          fi
          gh release upload latest Debate-Arena.apk --clobber
