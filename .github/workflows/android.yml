name: Build and publish Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Debate-Arena.apk
      - uses: actions/upload-artifact@v4
        with:
          name: debate-arena-debug-apk
          path: Debate-Arena.apk
          if-no-files-found: error
      - name: Publish direct-download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Debate Arena - Latest APK" --notes "Automatic development build. Not yet verified on a physical device." --prerelease
          gh release upload latest Debate-Arena.apk --clobber
